spring.application.name=career-guidance

# Database: file-based H2, nothing to install. Data is kept in ./data
spring.datasource.url=jdbc:h2:file:./data/career-guidance
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# To use PostgreSQL instead, add the postgresql driver to pom.xml and replace the lines above with:
# spring.datasource.url=jdbc:postgresql://localhost:5432/career-guidance
# spring.datasource.username=postgres
# spring.datasource.password=your_password

# Resume uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT (override JWT_SECRET in real use; it must be at least 32 characters)
app.jwt.secret=${JWT_SECRET:change-this-dev-secret-to-something-long-and-random}
app.jwt.expiration-ms=${JWT_EXPIRATION:604800000}
